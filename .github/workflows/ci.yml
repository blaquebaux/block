name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pricing-tests:
    name: Reference pricer tests (PRE-BL-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Run the gated pricing test suite
        run: julia test/runtests.jl
